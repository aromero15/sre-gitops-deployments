apiVersion: apps/v1
kind: Deployment
metadata:
  name: busy-box
spec:
  replicas: 2
  selector:
    matchLabels:
      app: busy-box
  template:
    metadata:
      labels:
        app: busy-box
    spec:
      containers:
        - name: busy-box
          image: docker.io/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            -  echo "Your message here"

